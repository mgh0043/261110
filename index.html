<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AERO BLITZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   AERO BLITZ — 공중전 슈팅
   ========================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const FONT = '"Orbitron","Segoe UI","Malgun Gothic",sans-serif';
const KFONT = '"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
};
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function compact(arr, fn) { let j = 0; for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (fn(o)) arr[j++] = o; } arr.length = j; }

/* ---------- sprite caches ---------- */
const glowCache = {};
function glow(color, size = 64) {
  const k = color + size;
  if (glowCache[k]) return glowCache[k];
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.18, color);
  gr.addColorStop(.5, color.replace('rgb(', 'rgba(').replace(')', ',.35)'));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return glowCache[k] = c;
}
// colors used in glow() must be rgb(...) form
const C_CYAN = 'rgb(77,225,255)', C_PINK = 'rgb(255,61,127)', C_ORANGE = 'rgb(255,150,40)', C_YELLOW = 'rgb(255,230,140)',
  C_RED = 'rgb(255,60,40)', C_WHITE = 'rgb(255,255,255)', C_GREEN = 'rgb(125,255,138)', C_PURPLE = 'rgb(190,90,255)', C_GOLD = 'rgb(255,200,70)';
function drawGlow(col, x, y, s, a = 1) {
  if (a <= 0 || s <= 0) return;
  ctx.globalAlpha = a;
  ctx.drawImage(glow(col), x - s / 2, y - s / 2, s, s);
}

const THEMES = [
  { name: 'SUNSET RIFT', c: ['#140a34', '#4b2273', '#ff7f5c'], sun: 'rgb(255,180,110)', cloud: [255, 205, 225] },
  { name: 'AZURE EXPANSE', c: ['#031a3a', '#0c4f86', '#56d4ff'], sun: 'rgb(230,250,255)', cloud: [235, 248, 255] },
  { name: 'AURORA NIGHT', c: ['#02030d', '#0a1838', '#145e63'], sun: 'rgb(125,255,214)', cloud: [150, 190, 230] },
  { name: 'CRIMSON STORM', c: ['#12030b', '#3d0a24', '#b8323f'], sun: 'rgb(255,90,77)', cloud: [205, 145, 165] },
];
function makeCloud(rgb) {
  const c = document.createElement('canvas'); c.width = 360; c.height = 200;
  const g = c.getContext('2d');
  for (let i = 0; i < 18; i++) {
    const x = rand(70, 290), y = rand(70, 130) + Math.sin((x - 70) / 220 * Math.PI) * -20, r = rand(30, 70);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.55)`);
    gr.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  return c;
}
const cloudSprites = THEMES.map(t => [0, 1, 2, 3].map(() => makeCloud(t.cloud)));

let vignette = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = W * DPR | 0; cv.height = H * DPR | 0;
  vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
  const g = vignette.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,10,.6)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
addEventListener('resize', resize); resize();

/* ---------- audio ---------- */
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .45; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.6, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, delay = 0) {
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfxGate = {};
function sfx(n, s = 1) {
  if (!AC || muted) return;
  const now = AC.currentTime;
  if (sfxGate[n] && now - sfxGate[n] < .035) return;
  sfxGate[n] = now;
  switch (n) {
    case 'shoot': tone('square', 1500, 600, .05, .018); break;
    case 'hit': tone('triangle', 700, 250, .04, .03); break;
    case 'boom': noise(.3 + .22 * s, Math.min(.5, .16 + .1 * s), 1600 + 500 * s); tone('sine', 130, 30, .3 + .2 * s, .22 * Math.min(s, 2)); break;
    case 'hurt': tone('sawtooth', 320, 60, .35, .14); noise(.25, .2, 3000); break;
    case 'pickup': [0, 1, 2].forEach(i => tone('sine', 620 * Math.pow(1.26, i), 900 * Math.pow(1.26, i), .12, .07, i * .06)); break;
    case 'bomb': noise(1.5, .55, 4000); tone('sine', 220, 20, 1.3, .45); break;
    case 'roll': noise(.25, .09, 6000); tone('sine', 300, 1000, .22, .05); break;
    case 'laser': tone('sawtooth', 90, 55, 1.1, .1); noise(1, .14, 900); break;
    case 'warn': tone('square', 440, 440, .22, .05); tone('square', 330, 330, .22, .05, .28); break;
    case 'missile': noise(.12, .04, 2500); break;
    case 'graze': tone('sine', 1800, 2400, .04, .015); break;
    case 'lock': tone('square', 900, 1200, .06, .03); break;
  }
}

/* ---------- input ---------- */
const keys = {};
const ptr = { x: 0, y: 0, active: false, down: false, offX: 0, offY: 0 };
let touchUI = false;
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onKey(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && P.alive) G.paused = true; });
function touchBtns() {
  const r = Math.min(46, W * .09);
  return { roll: { x: W - r * 1.4, y: H - r * 3.6, r }, bomb: { x: W - r * 1.4, y: H - r * 1.4, r } };
}
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && !ptr.down) return;
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true;
});
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch') {
    touchUI = true;
    const b = touchBtns();
    if (state === 'play') {
      if (Math.hypot(e.clientX - b.roll.x, e.clientY - b.roll.y) < b.roll.r * 1.2) { doRoll(); return; }
      if (Math.hypot(e.clientX - b.bomb.x, e.clientY - b.bomb.y) < b.bomb.r * 1.2) { bomb(); return; }
    }
    ptr.offX = P.x - e.clientX; ptr.offY = P.y - e.clientY;
  } else { ptr.offX = 0; ptr.offY = 0; }
  ptr.down = true; ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true;
  if (e.button === 2) doRoll();
  onClick();
});
addEventListener('pointerup', () => { ptr.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function onKey(code) {
  if (code === 'KeyM') { muted = !muted; return; }
  if (state === 'title' && (code === 'Space' || code === 'Enter')) { startGame(); return; }
  if (state === 'over' && G.overShow > 1.2 && (code === 'Space' || code === 'Enter' || code === 'KeyR')) { startGame(); return; }
  if (state === 'play') {
    if (code === 'KeyP' || code === 'Escape') { if (P.alive) G.paused = !G.paused; return; }
    if (G.paused) { G.paused = false; return; }
    if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyK') doRoll();
    if (code === 'KeyB' || code === 'KeyX' || code === 'KeyL') bomb();
  }
}
function onClick() {
  if (state === 'title') startGame();
  else if (state === 'over' && G.overShow > 1.2) startGame();
  else if (state === 'play' && G.paused) G.paused = false;
}

/* ---------- world state ---------- */
let state = 'title', G = null, P = null, titleT = 0, perfT = 0;
let timeScale = 1, slowT = 0, slowScale = 1;
let best = 0;
try { best = +localStorage.getItem('aeroblitz_best') || 0; } catch (e) { }
const cam = { trauma: 0, zoomKick: 0, tilt: 0 };
const sky = { from: 0, to: 0, t: 1 };
const bg = { scroll: 0, speed: 420, dust: [], clouds: [], near: [] };
let bullets = [], ebullets = [], enemies = [], parts = [], rings = [], texts = [], pickups = [], missiles = [], ghosts = [], timers = [], banners = [], callouts = [], bombs = [];

for (let i = 0; i < 110; i++) bg.dust.push({ x: rand(0, 1), y: rand(0, 1), z: rand(.2, 1) });
for (let i = 0; i < 7; i++) bg.clouds.push({ x: rand(-.1, 1.1), y: rand(-.2, 1.1), s: rand(.8, 1.6), z: rand(.25, .55), i: i % 4 });
for (let i = 0; i < 3; i++) bg.near.push({ x: rand(-.1, 1.1), y: rand(-1.5, 1), s: rand(2.2, 3.2), z: rand(1.6, 2.2), i: i % 4 });

function makePlayer() {
  return {
    x: W / 2, y: H * .78, vx: 0, vy: 0, dvx: 0, dvy: 0, bank: 0, hp: 100, hpLag: 100, power: 1, bombs: 3,
    inv: 0, roll: 0, rollCd: 0, rollDir: 1, fireT: 0, missT: .5, alive: true, intro: 0, trailL: [], trailR: [], ghostT: 0,
  };
}
P = makePlayer();

function startGame() {
  initAudio();
  state = 'play';
  bullets = []; ebullets = []; enemies = []; rings = []; texts = []; pickups = []; missiles = []; ghosts = []; timers = []; banners = []; callouts = []; bombs = [];
  P = makePlayer(); P.intro = 1.4; P.y = H + 80; P.x = W / 2;
  G = {
    score: 0, shown: 0, scorePop: 0, combo: 0, comboT: 0, comboPop: 0, maxCombo: 0, wave: 0, waveInStage: 0, stage: 0, waveT: 2.4,
    boss: null, bossPending: false, bossShake: 0, bossLag: 1, flash: .7, hurtT: 0, overT: 0, overShow: 0, paused: false,
    muzzle: 0, graze: 0, newBest: false, lightning: 0, t: 0,
  };
  setTheme(0);
  banner('MISSION START', '적 편대를 격추하라', 'wave', 2.2);
  addShake(.3);
}
function setTheme(i) { sky.from = sky.to; sky.to = i % THEMES.length; sky.t = sky.from === sky.to ? 1 : 0; }

/* ---------- fx helpers ---------- */
function addShake(a) { cam.trauma = Math.min(1, cam.trauma + a); }
function slowmo(scale, dur) { if (slowT <= 0 || scale <= slowScale) { slowScale = scale; slowT = dur; } else slowT = Math.max(slowT, dur * .5); }
function part(o) { if (parts.length > 2200) return null; o.max = o.max || o.life; parts.push(o); return o; }
function ring(x, y, max, life, w, col) { rings.push({ x, y, max, life, t: 0, w, col }); }
function floatText(x, y, text, col = '#fff', size = 18) { texts.push({ x, y, text, col, size, t: 0, dur: .95 }); }
function banner(title, sub, style, dur) { banners.push({ title, sub, style, t: 0, dur }); }
function callout(text, col) { callouts.push({ text, col, t: 0 }); }
function after(t, fn, spawn = false) { timers.push({ t, fn, spawn }); }
function sparks(x, y, n, col, spd = 500, life = .35, size = 2.2, ang = null, spread = TAU) {
  for (let i = 0; i < n; i++) {
    const a = ang === null ? rand(0, TAU) : ang + rand(-spread / 2, spread / 2);
    const s = rand(spd * .3, spd);
    part({ k: 0, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * .5, life), size: rand(size * .6, size), col, drag: 4 });
  }
}
function explode(x, y, s = 1, hueCol = C_ORANGE) {
  const rs = Math.sqrt(s);
  part({ k: 1, x, y, vx: 0, vy: 0, life: .22, size: 170 * rs, col: C_WHITE, grow: -1 });
  part({ k: 1, x, y, vx: 0, vy: 0, life: .45, size: 120 * rs, col: hueCol, grow: 1.5 });
  for (let i = 0; i < 8 * s + 6; i++) {
    const a = rand(0, TAU), sp = rand(40, 230) * rs;
    part({ k: 4, x: x + rand(-8, 8) * rs, y: y + rand(-8, 8) * rs, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.4, .9), size: rand(30, 64) * rs, drag: 3 });
  }
  sparks(x, y, Math.round(12 * s + 6), C_YELLOW, 900 * rs, .5, 2.6);
  for (let i = 0; i < 5 * s + 2; i++) {
    const a = rand(0, TAU), sp = rand(30, 120) * rs;
    part({ k: 2, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.9, 1.8), size: rand(14, 30) * rs, grow: 26 * rs, drag: 2, col: '40,32,48', a: .55 });
  }
  for (let i = 0; i < Math.round(3 * s + 1); i++) {
    const a = rand(0, TAU), sp = rand(150, 420) * rs;
    part({ k: 3, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.6, 1.3), size: rand(4, 9) * rs, rot: rand(0, TAU), vr: rand(-14, 14), drag: 1.6, tT: 0 });
  }
  ring(x, y, 80 * s, .5, 7 * rs, hueCol);
  if (s > 1.5) ring(x, y, 140 * s, .8, 3 * rs, C_WHITE);
  addShake(.12 * s);
  sfx('boom', s);
}

/* ---------- player actions ---------- */
function doRoll() {
  if (state !== 'play' || !P.alive || P.rollCd > 0 || P.intro > 0 || G.paused) return;
  P.roll = .55; P.rollCd = 1.0;
  let ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let iy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (!ix && !iy) { const l = Math.hypot(P.vx, P.vy); if (l > 40) { ix = P.vx / l; iy = P.vy / l; } else ix = P.bank >= 0 ? 1 : -1; }
  const l = Math.hypot(ix, iy) || 1;
  P.dvx = ix / l * 950; P.dvy = iy / l * 950;
  P.rollDir = ix >= 0 ? 1 : -1;
  ring(P.x, P.y, 70, .35, 4, C_CYAN);
  sparks(P.x, P.y, 14, C_CYAN, 400, .3, 2);
  sfx('roll');
}
function bomb() {
  if (state !== 'play' || !P.alive || P.bombs <= 0 || P.intro > 0 || G.paused) return;
  P.bombs--;
  bombs.push({ x: P.x, y: P.y, r: 0, id: Math.random() });
  G.flash = .9; addShake(.8); slowmo(.3, .35); cam.zoomKick += .09;
  ring(P.x, P.y, Math.max(W, H) * 1.2, 1.1, 30, C_CYAN);
  ring(P.x, P.y, Math.max(W, H) * .8, .9, 12, C_WHITE);
  sparks(P.x, P.y, 60, C_CYAN, 1400, .7, 3);
  callout('BOMB!', '#4de1ff');
  sfx('bomb');
}
function hurt(d) {
  if (P.inv > 0 || P.roll > 0 || !P.alive || P.intro > 0) return;
  P.hp -= d; P.inv = 1.2; G.hurtT = 1; addShake(.55); slowmo(.2, .14); cam.zoomKick += .035;
  sparks(P.x, P.y, 24, C_RED, 600, .45, 2.6);
  ring(P.x, P.y, 60, .35, 5, C_RED);
  if (G.combo >= 10) floatText(P.x, P.y - 40, 'COMBO BREAK', '#ff6b6b', 16);
  G.combo = 0; G.comboT = 0;
  sfx('hurt');
  if (P.hp <= 0) die();
}
function die() {
  P.hp = 0; P.alive = false;
  explode(P.x, P.y, 3.2, C_CYAN);
  for (let i = 1; i < 5; i++) { const x = P.x, y = P.y; after(i * .14, () => explode(x + rand(-40, 40), y + rand(-40, 40), 1.5)); }
  slowmo(.25, 1.4); G.flash = 1; cam.zoomKick += .12; addShake(1);
  G.overT = 2.6;
}
function addScore(n) { G.score += n; G.scorePop = 1; }
function comboMult() { return 1 + Math.min(4, Math.floor(G.combo / 10) * .5); }
function drop(x, y, k) {
  if (!k) { const r = Math.random(); k = r < .45 ? 'P' : r < .8 ? 'H' : 'B'; }
  pickups.push({ x, y, k, t: 0, vx: rand(-70, 70), vy: -140 });
}

/* ---------- enemies ---------- */
const ET = {
  drone: { hp: 3, r: 16, sc: 100 }, fighter: { hp: 8, r: 20, sc: 250 }, sweeper: { hp: 4, r: 16, sc: 150 },
  kami: { hp: 3, r: 15, sc: 180 }, heavy: { hp: 70, r: 46, sc: 1500 }, emis: { hp: 2, r: 9, sc: 50 }, boss: { hp: 1300, r: 95, sc: 25000 },
};
const BOSSNAMES = ['LEVIATHAN-X', 'SERAPH CORE', 'OBSIDIAN TALON'];
function diff() { return 1 + (G.wave - 1) * .06 + G.stage * .3; }
function spawn(type, x, y, o = {}) {
  const d = ET[type];
  let hp = d.hp * (1 + G.stage * .5);
  if (type === 'boss') hp = d.hp * (1 + G.stage * .7);
  const e = Object.assign({ type, x, y, x0: x, y0: y, vx: 0, vy: 0, hp, maxhp: hp, r: d.r, sc: d.sc, t: 0, hitT: 0, rot: 0, fireT: rand(.7, 1.8), burst: 0, burstT: 0 }, o);
  enemies.push(e);
  return e;
}
function aim(x, y) { return Math.atan2(P.y - y, P.x - x); }
function eshoot(x, y, ang, spd, o = {}) {
  ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: o.r || 6, col: o.col || C_PINK, t: 0, gz: false });
}
const FORM = {
  column(d) { const x = rand(.2, .8) * W, amp = rand(50, 130); for (let i = 0; i < 6; i++) after(d + i * .26, () => spawn('drone', x, -40, { amp, ph: i * .55 }), true); },
  vee(d) {
    const cx = rand(.3, .7) * W, n = 5;
    for (let i = 0; i < n; i++) { const o = i - (n - 1) / 2; after(d + Math.abs(o) * .16, () => spawn('fighter', cx + o * 62, -50, { hold: H * .26 - Math.abs(o) * 34 }), true); }
  },
  sweep(d) {
    const left = Math.random() < .5, by = H * rand(.08, .22);
    for (let i = 0; i < 8; i++) after(d + i * .17, () => spawn('sweeper', left ? -40 : W + 40, by, { dir: left ? 1 : -1, baseY: by }), true);
  },
  swarm(d) { const n = 7 + Math.min(8, G.wave / 2 | 0); for (let i = 0; i < n; i++) after(d + i * .16, () => spawn('kami', rand(.08, .92) * W, -30, { spin: 0 }), true); },
  heavy(d) {
    after(d, () => spawn('heavy', W / 2 + rand(-W * .15, W * .15), -90), true);
    FORM.sweep(d + 1.5);
  },
};
function director(dt) {
  if (G.boss || G.bossPending) return;
  G.waveT -= dt;
  const pend = timers.some(t => t.spawn);

    ctx.fillStyle = g; slant(bxx, byy, bw * Math.max(0, B.hp / B.maxhp), 10, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(W / 2 - 1, byy - 2, 2, 14);
    ctx.restore();
  }
  // touch buttons
  if (touchUI) {
    const tb = touchBtns();
    for (const [k, b] of Object.entries(tb)) {
      ctx.globalAlpha = .55; ctx.fillStyle = 'rgba(10,20,40,.6)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = k === 'roll' ? '#4de1ff' : '#ffc846'; ctx.lineWidth = 2; ctx.stroke();
      ctx.globalAlpha = .9; ctx.fillStyle = '#fff'; ctx.font = `900 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(k.toUpperCase(), b.x, b.y);
    }
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
}
function drawTitle() {
  const t = titleT;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const txt = 'AERO BLITZ';
  const fs = Math.min(W * .12, 112);
  ctx.font = `900 italic ${fs}px ${FONT}`;
  const ws = [...txt].map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  const cy = H * .3;
  const glitch = (t % 2.8) > 2.62;
  // underline swoosh
  const ul = ease.outCubic(clamp((t - .9) / .6, 0, 1));
  ctx.fillStyle = '#4de1ff'; ctx.globalAlpha = .9;
  ctx.fillRect(W / 2 - total * .55 * ul, cy + fs * .55, total * 1.1 * ul, 3);
  ctx.fillStyle = '#ff3d7f'; ctx.fillRect(W / 2 - total * .45 * ul + 20, cy + fs * .55 + 7, total * .9 * ul, 2);
  ctx.globalAlpha = 1;
  for (let i = 0; i < txt.length; i++) {
    const lt = clamp((t - .15 - i * .06) / .6, 0, 1);
    const e = ease.outBack(lt);
    const cx = x + ws[i] / 2;
    x += ws[i];
    if (lt <= 0) continue;
    ctx.save();
    ctx.translate(cx + (glitch ? rand(-10, 10) : 0), cy + (1 - e) * -140 + Math.sin(t * 2 + i * .5) * 4);
    ctx.rotate((1 - e) * -.6);
    const sc = 1 + (1 - lt) * 1.2; ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, lt * 2);
    const sh = (t * .6 - i * .04) % 1.6;
    const shine = sh > 0 && sh < .25 ? 1 - Math.abs(sh - .125) / .125 : 0;
    chromaText(txt[i], 0, 0, glitch ? 9 : 3 + (1 - lt) * 14, shine > 0 ? `rgb(255,${255},${Math.round(255 - shine * 80)})` : '#f4f8ff');
    ctx.restore();
  }
  // subtitle
  const st = clamp((t - 1.1) / .5, 0, 1);
  ctx.globalAlpha = st;
  ctx.font = `700 ${Math.min(18, W * .04)}px ${KFONT}`; ctx.fillStyle = '#bfe9ff';
  if ('letterSpacing' in ctx) ctx.letterSpacing = (8 + (1 - st) * 20) + 'px';
  ctx.fillText('초음속 공중전 슈팅', W / 2, cy + fs * .55 + 34);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  // prompt
  const pt = clamp((t - 1.5) / .4, 0, 1);
  ctx.globalAlpha = pt * (.55 + .45 * Math.sin(t * 4));
  ctx.font = `900 ${Math.min(20, W * .045)}px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.fillText('CLICK  /  PRESS SPACE', W / 2, H * .52);
  // controls
  ctx.globalAlpha = pt * .75;
  ctx.font = `500 ${Math.min(13, W * .03)}px ${KFONT}`; ctx.fillStyle = '#cfe6ff';
  const lines = ['이동: WASD · 방향키 · 마우스 (자동 사격)', 'SHIFT / 우클릭: 배럴롤 (무적 회피)   ·   B: 폭탄', 'P: 일시정지   ·   M: 음소거'];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H * .9 - (lines.length - 1 - i) * 22));
  if (best > 0) { ctx.font = `700 12px ${FONT}`; ctx.fillStyle = '#ffd34d'; ctx.fillText('HI-SCORE  ' + best.toLocaleString(), W / 2, H * .57); }
  ctx.restore();
}
function drawOver() {
  const t = G.overShow;
  const k = ease.outCubic(clamp(t / .6, 0, 1));
  ctx.save();
  ctx.fillStyle = `rgba(5,0,10,${.6 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.min(W * .09, 70);
  ctx.font = `900 ${fs}px ${FONT}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = lerp(60, 6, k) + 'px';
  ctx.globalAlpha = k;
  chromaText('MISSION FAILED', W / 2, H * .3, 3 + (1 - k) * 20, '#ff4d6d');
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  const rows = [
    ['SCORE', Math.floor(G.score * ease.outCubic(clamp((t - .6) / 1.2, 0, 1))).toLocaleString()],
    ['MAX COMBO', G.maxCombo], ['REACHED', `STAGE ${G.stage + 1} · WAVE ${G.wave}`], ['GRAZE', G.graze],
  ];
  rows.forEach((r, i) => {
    const rt = ease.outBack(clamp((t - .5 - i * .15) / .4, 0, 1));
    ctx.globalAlpha = clamp((t - .5 - i * .15) / .3, 0, 1);
    const y = H * .44 + i * 36, off = (1 - rt) * 60;
    ctx.font = `700 13px ${FONT}`; ctx.fillStyle = 'rgba(200,220,255,.7)'; ctx.textAlign = 'right';
    ctx.fillText(r[0], W / 2 - 16 - off, y);
    ctx.font = `900 ${i === 0 ? 26 : 18}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(r[1], W / 2 + 16 + off, y);
  });
  ctx.textAlign = 'center';
  if (G.newBest && t > 1.6) {
    ctx.globalAlpha = .6 + .4 * Math.sin(t * 8);
    ctx.save(); ctx.translate(W / 2, H * .44 + 4 * 36 + 10); ctx.rotate(-.05); const s = 1 + Math.max(0, 1 - (t - 1.6) * 3) * .8; ctx.scale(s, s);
    ctx.font = `900 italic 24px ${FONT}`; chromaText('NEW RECORD!', 0, 0, 3, '#ffd34d'); ctx.restore();
  }
  if (t > 1.2) {
    ctx.globalAlpha = .55 + .45 * Math.sin(t * 4);
    ctx.font = `700 ${Math.min(16, W * .04)}px ${KFONT}`; ctx.fillStyle = '#fff';
    ctx.fillText('SPACE / 클릭으로 재출격', W / 2, H * .82);
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawSky();
  const tr = cam.trauma * cam.trauma, sh = tr * 24, tt = perfT;
  const sx = sh * (Math.sin(tt * 47.3) + Math.sin(tt * 91.7) * .5) / 1.5;
  const sy = sh * (Math.sin(tt * 53.1 + 1) + Math.sin(tt * 83.3) * .5) / 1.5;
  const sr = tr * .035 * Math.sin(tt * 37.7);
  const z = 1 + cam.zoomKick;
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(sr + cam.tilt); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  drawBackWorld();
  if (state !== 'title') { drawShadows(); drawPickups(); for (const e of enemies) drawEnemy(e); drawBullets(); }
  drawPlayer();
  drawParticles();
  if (state !== 'title') {
    drawEBullets();
    for (const e of enemies) if (e.type === 'boss') drawLaser(e);
    for (const b of bombs) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(120,230,255,.5)'; ctx.lineWidth = 40;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 6; ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  drawNearClouds();
  if (state !== 'title') drawTexts();
  ctx.restore();

  ctx.drawImage(vignette, 0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  if (G.hurtT > 0 || P.hp < 30) {
    const a = Math.max(G.hurtT * .7, P.alive && P.hp < 30 ? .25 + .15 * Math.sin(perfT * 6) : 0);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash * .8})`; ctx.fillRect(0, 0, W, H); }
  drawBanners();
  drawCallouts();
  if (state === 'play' || state === 'over') drawHUD();
  if (state === 'over') drawOver();
  if (G.paused) {
    ctx.fillStyle = 'rgba(0,0,10,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 48px ${FONT}`;
    chromaText('PAUSED', W / 2, H / 2, 3);
    ctx.font = `500 14px ${KFONT}`; ctx.fillStyle = '#cfe6ff'; ctx.fillText('아무 키나 / 클릭으로 계속', W / 2, H / 2 + 44);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.font = `700 10px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillText('MUTED', W - 24, H - 70); }
}

function frame(now) {
  const rdt = Math.min((now - last) / 1000, .05); last = now;
  update(rdt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
